<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kişiselleştirilmiş Öğrenme Deneyimi ve Coursera | MEF Üniversitesi CELT</title>
<meta name="description" content="MEF Üniversitesi CELT — Kişiselleştirilmiş Öğrenme Deneyimi (PLE) ve Coursera Programı: süreç rehberi, akademik takvim, ders kataloğu, kredilendirme kuralları, bölüm koordinatörleri ve sık sorulan sorular.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FDFBF7; --ink:#232C48;
    --navy:#1F2D5C; --navy-dark:#101B41;
    --red:#E8432D; --red-dark:#C9331F; --red-darker:#B32A17;
    --blue:#0056D2;
    --green:#1D7A46; --green-light:#5CDB95;
    --purple:#7A5AB8;
    --muted:#7A86A8; --muted2:#4A5170; --muted3:#6E7590; --muted4:#565E7C; --muted5:#98A2B8;
    --border:#E0E7F3; --border2:#E4EBF6; --border3:#D5DDEB; --border4:#DCE5F4;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--cream); color:var(--ink); font-family:'Instrument Sans',sans-serif; min-width:0; overflow-x:hidden}
  a{color:var(--red); text-decoration:none}
  a:hover{color:var(--red-darker); text-decoration:underline}
  button{font:inherit}
  img{max-width:100%}
  .wrap{max-width:1080px; margin:0 auto}
  .eyebrow{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:14px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:16px}
  .h2{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; color:var(--navy); margin:0 0 20px}

  @keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(29,122,70,.45)}70%{box-shadow:0 0 0 14px rgba(29,122,70,0)}100%{box-shadow:0 0 0 0 rgba(29,122,70,0)}}
  @keyframes stepIn{from{opacity:0; transform:translateX(-14px)}to{opacity:1; transform:translateX(0)}}

  /* NAV */
  nav{position:sticky; top:0; z-index:50; background:rgba(253,251,247,.94); backdrop-filter:blur(10px); display:flex; align-items:center; gap:16px; padding:12px clamp(16px,3vw,40px); min-height:76px; flex-wrap:wrap; border-bottom:1px solid var(--border)}
  .nav-logo{display:flex; align-items:center; gap:14px; text-decoration:none; cursor:pointer}
  .nav-logo:hover{text-decoration:none}
  .nav-logo img{height:clamp(42px,6vw,58px); width:auto; display:block}
  .nav-divider{width:1px; height:34px; background:var(--border4)}
  .nav-brand{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:14px; letter-spacing:.2px; color:var(--navy); line-height:1.2; max-width:230px}
  .nav-spacer{flex:1 1 0; min-width:0}
  .nav-links{display:flex; flex-wrap:wrap; justify-content:flex-start; gap:5px; font-size:13.5px; font-weight:600}
  .nav-btn{all:unset; box-sizing:border-box; cursor:pointer; color:var(--muted2); background:transparent; padding:9px 13px; border-radius:999px; font-family:'Instrument Sans',sans-serif; font-weight:600; white-space:nowrap; min-height:38px; display:inline-flex; align-items:center}
  .nav-btn:hover{background:#E9EFFB; color:var(--navy)}
  .nav-btn.active{background:var(--navy); color:#fff}
  .nav-btn.active:hover{background:var(--navy)}
  .lang-toggle{display:flex; align-items:center; gap:2px; background:#EDF2F9; border:1px solid var(--border4); border-radius:999px; padding:3px; flex-shrink:0}
  .lang-btn{all:unset; box-sizing:border-box; cursor:pointer; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:12.5px; letter-spacing:.6px; padding:7px 14px; border-radius:999px; min-height:30px; display:inline-flex; align-items:center; color:var(--muted)}
  .lang-btn:hover{color:var(--navy)}
  .lang-btn.active{background:var(--navy); color:#fff}
  .lang-btn.active:hover{color:#fff}

  /* HERO */
  header.hero{background:linear-gradient(150deg,#D6E4FA 0%,#EAF1FC 30%,#FDFBF7 60%,#DCE6FA 100%); background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 43px,rgba(31,45,92,.10) 43px,rgba(31,45,92,.10) 44px),linear-gradient(150deg,#D6E4FA 0%,#EAF1FC 30%,#FDFBF7 60%,#DCE6FA 100%); padding:clamp(52px,8vw,104px) clamp(18px,4vw,48px) clamp(56px,8vw,112px); position:relative; overflow:hidden}
  .hero-blob-1{position:absolute; right:60px; top:70px; width:210px; height:210px; border-radius:50%; background:var(--red); opacity:.10}
  .hero-blob-2{position:absolute; right:190px; top:220px; width:120px; height:120px; border-radius:50%; background:var(--navy); opacity:.10}
  .hero-blob-3{position:absolute; right:110px; bottom:60px; width:64px; height:64px; border-radius:16px; background:var(--blue); opacity:.22; transform:rotate(18deg)}
  .hero-inner{max-width:1080px; margin:0 auto; position:relative}
  .hero-badge{display:inline-flex; align-items:center; gap:10px; background:var(--navy); color:#fff; padding:9px 20px; border-radius:999px; font-size:13.5px; font-weight:700; box-shadow:0 6px 18px rgba(31,45,92,.22)}
  .hero-badge .dot{width:9px; height:9px; border-radius:50%; background:var(--green-light); display:inline-block; animation:pulseRing 2s ease-out infinite}
  .hero h1{font-family:'Caveat',cursive; font-weight:700; font-size:clamp(42px,8vw,78px); line-height:1.05; margin:26px 0 14px; color:var(--navy); text-wrap:balance}
  .hero h1 .accent{color:var(--red); position:relative; display:inline-block; white-space:nowrap}
  .hero h1 .accent .underline{position:absolute; left:0; right:0; bottom:2px; height:14px; background:linear-gradient(90deg,rgba(0,86,210,.28),rgba(0,86,210,.07)); border-radius:999px; z-index:-1}
  .hero-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-top:12px}
  .hero-card{border-radius:20px; padding:clamp(22px,3vw,30px) clamp(20px,3vw,28px) clamp(20px,3vw,26px); text-decoration:none; display:block; transition:transform .2s ease, border-color .2s ease; cursor:pointer}
  .hero-card:hover{text-decoration:none; transform:translateY(-4px)}
  .hero-card .emoji{display:block; font-size:28px; margin-bottom:16px}
  .hero-card .title{display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:21px; line-height:1.2}
  .hero-card .desc{display:block; font-size:14.5px; margin-top:8px; line-height:1.5}
  .hero-card .cta{display:inline-block; margin-top:16px; font-weight:700; font-size:14px}
  .hero-card.red{background:var(--red); box-shadow:0 12px 30px rgba(232,67,45,.28)}
  .hero-card.red .title, .hero-card.red .cta{color:#fff}
  .hero-card.red .desc{color:#FBD9D2}
  .hero-card.white{background:#fff; border:1.5px solid var(--border3); box-shadow:0 6px 20px rgba(31,45,92,.07)}
  .hero-card.white:hover{border-color:var(--blue)}
  .hero-card.white .title{color:var(--navy)}
  .hero-card.white .desc{color:var(--muted)}
  .hero-card.white .cta{color:var(--blue)}
  .hero-card.navy{background:var(--navy); box-shadow:0 12px 30px rgba(31,45,92,.22)}
  .hero-card.navy .title{color:#fff}
  .hero-card.navy .desc{color:#B9C4E2}
  .hero-card.navy .cta{color:#7FA8EE}

  /* Generic section */
  section.tab-section{scroll-margin-top:92px; padding:clamp(48px,7vw,96px) clamp(18px,4vw,48px)}
  .section-bg-1{background:#FDFBF7; background-image:repeating-linear-gradient(-45deg,rgba(31,45,92,.035) 0px,rgba(31,45,92,.035) 1px,transparent 1px,transparent 18px),radial-gradient(circle at 6% 10%,rgba(0,86,210,.10) 0%,rgba(0,86,210,0) 30%),radial-gradient(circle at 95% 90%,rgba(31,45,92,.09) 0%,rgba(31,45,92,0) 32%),linear-gradient(180deg,#FDFBF7 0%,#F3EFFA 100%)}
  .section-bg-2{background:#FDFBF7; background-image:radial-gradient(circle at 8% 12%,rgba(232,67,45,.09) 0%,rgba(232,67,45,0) 30%),radial-gradient(circle at 94% 85%,rgba(0,86,210,.09) 0%,rgba(240,160,40,0) 32%),repeating-linear-gradient(0deg,rgba(31,45,92,.03) 0px,rgba(31,45,92,.03) 1px,transparent 1px,transparent 22px),linear-gradient(180deg,#FDFBF7 0%,#E9F0FB 100%)}
  .section-bg-3{background:#EEF2F9; background-image:radial-gradient(rgba(232,67,45,.06) 1.5px,transparent 1.5px),linear-gradient(170deg,#E4EDFA 0%,#EEF2F9 50%,#EAEDF8 100%); background-size:26px 26px, auto}
  .section-bg-4{background:#EEF2F9; background-image:radial-gradient(circle at 90% 12%,rgba(0,86,210,.09) 0%,rgba(0,86,210,0) 32%),linear-gradient(180deg,#F1F5FC 0%,#EEF2F9 100%)}
  .section-bg-5{background:#FDFBF7; background-image:radial-gradient(circle at 92% 10%,rgba(0,86,210,.09) 0%,rgba(0,86,210,0) 32%),repeating-linear-gradient(180deg,rgba(31,45,92,.03) 0px,rgba(31,45,92,.03) 1px,transparent 1px,transparent 20px),linear-gradient(180deg,#FDFBF7 0%,#F1F5FC 100%)}
  .section-bg-6{background:#EEF2F9; background-image:radial-gradient(rgba(31,45,92,.07) 1.5px,transparent 1.5px),linear-gradient(165deg,#DDE9FB 0%,#EEF2F9 45%,#E9EDF9 100%); background-size:26px 26px, auto}

  /* PROCESS */
  .process-heading-row{display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:12px}
  .process-heading-row h2{font-size:clamp(28px,5vw,46px); line-height:1.1; margin:0}
  .process-heading-row h2 .accent{color:var(--red)}
  .current-pill{display:inline-flex; align-items:center; gap:8px; background:var(--green); color:#fff; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:700}
  .current-pill .dot{width:8px; height:8px; border-radius:50%; background:var(--green-light); display:inline-block}
  .process-intro{font-size:16.5px; line-height:1.7; margin:0 0 14px; max-width:760px; color:var(--muted2)}
  .process-legend{font-size:15.5px; line-height:1.7; margin:0 0 26px; max-width:760px; color:#66708C}
  .tag-chip{display:inline-block; color:#fff; font-size:11px; font-weight:700; padding:2px 8px; border-radius:4px; vertical-align:1px}
  .tag-chip.celt{background:var(--red)}
  .tag-chip.coord{background:var(--blue)}
  .tag-chip.student{background:var(--purple)}
  .tag-chip.current{background:var(--green); animation:pulseRing 2.4s ease-out infinite}
  .tag-chip.done{background:#E7EEFB; color:var(--navy)}
  .resource-link{display:inline-flex; align-items:center; gap:12px; background:#fff; border:1.5px solid var(--border3); border-radius:14px; padding:14px 22px; text-decoration:none; margin:0 0 44px; box-shadow:0 3px 10px rgba(31,45,92,.06); cursor:pointer}
  .resource-link:hover{border-color:var(--blue); text-decoration:none}
  .resource-link .emoji{font-size:20px}
  .resource-link .title{display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; color:var(--navy)}
  .resource-link .sub{display:block; font-size:13px; color:var(--muted); margin-top:1px}
  .resource-link .arrow{color:var(--blue); font-weight:700; margin-left:6px}

  .rail{display:flex; flex-wrap:wrap; align-items:stretch; gap:4px; background:#fff; border:1px solid var(--border4); border-radius:18px; padding:8px; margin:0 0 40px; box-shadow:0 6px 20px rgba(31,45,92,.08)}
  .rail-btn{all:unset; box-sizing:border-box; cursor:pointer; flex:1 1 120px; min-width:110px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px 8px 12px; border-radius:12px; background:transparent; transition:box-shadow .18s ease, transform .18s ease}
  .rail-btn:hover{box-shadow:inset 0 0 0 2px var(--navy); transform:translateY(-2px)}
  .rail-btn .circle{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:12.5px; border:2px solid var(--border3); background:#fff; color:var(--muted5)}
  .rail-btn .label{font-size:11.5px; font-weight:700; text-align:center; line-height:1.25; color:var(--muted5)}
  .rail-btn.done .circle{background:var(--navy); color:#fff; border-color:var(--navy)}
  .rail-btn.done .label{color:var(--navy)}
  .rail-btn.current .circle{background:var(--green); color:#fff; border-color:var(--green)}
  .rail-btn.current .label{color:var(--green)}
  .rail-btn.selected{background:var(--navy)}
  .rail-btn.selected .circle{background:#fff; border-color:#fff; color:var(--navy)}
  .rail-btn.selected .label{color:#fff}

  .step-card{position:relative; border-radius:20px; padding:clamp(22px,3vw,34px) clamp(20px,3vw,40px) clamp(22px,3vw,34px) clamp(18px,3vw,36px); overflow:hidden; animation:stepIn .5s ease both; border:1.5px solid var(--border2); border-left:6px solid var(--blue); background:#fff; box-shadow:0 6px 20px rgba(31,45,92,.07)}
  .step-card.current{border-color:#BFE3CD; border-left-color:var(--green); background:#F6FCF8; box-shadow:0 14px 34px rgba(29,122,70,.16)}
  .step-card.done{border-left-color:var(--navy)}
  .step-ghost{position:absolute; right:22px; top:-18px; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(72px,12vw,132px); line-height:1; color:rgba(0,86,210,.07); pointer-events:none; user-select:none}
  .step-card.current .step-ghost{color:rgba(29,122,70,.10)}
  .step-card.done .step-ghost{color:rgba(31,45,92,.06)}
  .step-content{position:relative}
  .step-badges{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
  .step-eyebrow{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:12px; letter-spacing:1.4px; color:var(--blue); text-transform:uppercase}
  .step-card.current .step-eyebrow{color:var(--green)}
  .step-card.done .step-eyebrow{color:var(--navy)}
  .step-title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:25px; line-height:1.2; color:#3A4160; max-width:660px}
  .step-card.current .step-title{color:var(--green)}
  .step-card.done .step-title{color:var(--navy)}
  .step-body{margin-top:12px}
  .step-desc{font-size:15.5px; line-height:1.7; color:var(--muted2); max-width:760px}
  .step-desc p{margin:0 0 10px}
  .step-desc p:last-child{margin-bottom:0}
  .step-desc .bullets{padding-left:4px}
  .step-note{margin-top:18px; border-radius:14px; padding:16px 20px; display:flex; gap:14px; align-items:flex-start; max-width:700px; border:1px solid}
  .step-note .emoji{font-size:18px; flex-shrink:0}
  .step-note .text{font-size:14.5px; line-height:1.65}
  .step-link{margin-top:20px; display:inline-flex; align-items:center; gap:10px; background:var(--navy); border:1.5px solid var(--navy); border-radius:12px; padding:13px 22px; text-decoration:none; box-shadow:0 6px 16px rgba(31,45,92,.18); transition:transform .18s ease}
  .step-link:hover{background:var(--red); border-color:var(--red); text-decoration:none; transform:translateY(-2px)}
  .step-link .emoji{font-size:18px}
  .step-link .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:14.5px; color:#fff}
  .step-link .arrow{color:#fff; font-weight:700}

  .checklist-panel{background:var(--navy); border-radius:18px; padding:26px 28px 22px; box-shadow:0 14px 34px rgba(31,45,92,.24); margin-bottom:20px}
  .checklist-toggle{all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:14px; width:100%; cursor:pointer; padding-bottom:16px; border-bottom:1px solid rgba(255,255,255,.16)}
  .checklist-panel.closed .checklist-toggle{padding-bottom:0; border-bottom:none}
  .checklist-toggle .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:18px; color:#fff}
  .checklist-toggle .meta{display:flex; align-items:center; gap:12px; flex-shrink:0}
  .checklist-toggle .count{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:12px; letter-spacing:1.2px; color:#7FA8EE; white-space:nowrap}
  .checklist-toggle .icon{width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; font-size:17px; font-weight:700}
  .checklist-items{display:none}
  .checklist-panel.open .checklist-items{display:block}
  .checklist-item{display:grid; grid-template-columns:30px 1fr; gap:14px; align-items:start; padding:16px 0; border-bottom:1px solid rgba(255,255,255,.09); animation:stepIn .35s ease both}
  .checklist-item .no{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:15px; color:var(--green-light); line-height:1.35}
  .checklist-item .ctitle{display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15.5px; color:#fff}
  .checklist-item .ctext{display:block; font-size:14px; line-height:1.65; color:#B9C4E2; margin-top:5px}

  /* PROGRAM info card (kredilendirme + coursera catalog shared bits) */
  .card{background:#fff; border:1.5px solid var(--border2); border-radius:20px; padding:clamp(20px,2.5vw,26px) clamp(18px,2.5vw,28px); box-shadow:0 6px 20px rgba(31,45,92,.07)}
  .card-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .card-num{width:30px; height:30px; border-radius:10px; background:var(--navy); color:#fff; display:grid; place-items:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:15px; flex-shrink:0}
  .card-head .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:19px; color:var(--navy)}
  .check-row{display:grid; grid-template-columns:24px 1fr; gap:12px; align-items:start}
  .check-box{width:22px; height:22px; border:2px solid #C6D2E8; border-radius:6px; margin-top:2px; flex-shrink:0}
  .check-text{font-size:14px; line-height:1.6; color:var(--muted2)}
  .check-text strong{color:var(--navy)}
  .warn-box{background:#FFF9E8; border:1px solid #F0E0B0; border-radius:14px; padding:18px 22px}
  .warn-box .head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .warn-box .head .emoji{font-size:17px}
  .warn-box .head .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; color:#6B5518}
  .warn-box .body{font-size:13.5px; line-height:1.6; color:#6B5518}
  .warn-box .body strong{color:#6B5518}

  /* DEPARTMENTS */
  .contact-panel{border-radius:20px; padding:clamp(20px,3vw,28px) clamp(20px,3vw,32px); color:#fff}
  .contact-panel.red{background:linear-gradient(135deg,var(--red) 0%,var(--red-dark) 100%); box-shadow:0 10px 26px rgba(232,67,45,.24)}
  .contact-panel.blue{background:linear-gradient(135deg,var(--blue) 0%,var(--navy) 100%); box-shadow:0 10px 26px rgba(31,45,92,.24)}
  .contact-head{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .contact-icon{width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.18); display:grid; place-items:center; font-size:19px; flex-shrink:0}
  .contact-head .title{display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px; line-height:1.15}
  .contact-head .sub{display:block; font-size:12.5px; margin-top:1px}
  .contact-panel.red .contact-head .sub{color:#FBD9D2}
  .contact-panel.blue .contact-head .sub{color:#C3D5F5}
  .contact-tags{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px}
  .contact-tags span{background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.24); padding:6px 13px; border-radius:999px; font-size:13px; font-weight:600}
  .contact-btn{display:inline-block; background:#fff; color:var(--red); font-weight:800; font-size:14.5px; padding:11px 22px; border-radius:999px; text-decoration:none}
  .contact-btn:hover{background:var(--navy); color:#fff; text-decoration:none}
  .contact-hint{display:inline-block; font-weight:800; font-size:14.5px; color:#9FC0F2}

  .fac-item{background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden}
  .fac-toggle{all:unset; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; gap:16px; width:100%; padding:15px 22px; cursor:pointer}
  .fac-toggle:hover{background:#F2F6FD}
  .fac-toggle .left{display:flex; align-items:center; gap:12px}
  .fac-dot{width:8px; height:8px; border-radius:2px; display:inline-block}
  .fac-name{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:16.5px; color:var(--navy)}
  .fac-count{font-size:12.5px; font-weight:600; color:var(--muted5)}
  .fac-icon{width:26px; height:26px; border-radius:50%; background:#F2F6FD; color:var(--blue); display:grid; place-items:center; font-size:16px; flex-shrink:0}
  .fac-body{padding:0 22px 16px; display:none}
  .fac-item.open .fac-body{display:block}
  .fac-depts{display:grid; gap:1px; background:#EDF2F9; border:1px solid var(--border2); border-radius:10px; overflow:hidden}
  .fac-dept-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:6px 16px; align-items:center; background:#fff; padding:12px 16px; font-size:13.5px}
  .fac-dept-row .dname{font-weight:700; color:var(--navy); line-height:1.35}
  .fac-dept-row .dcoord{color:var(--muted2)}
  .fac-dept-row a{font-size:13px}

  /* CALENDAR */
  .cal-legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:28px}
  .cal-legend-item{display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border2); border-radius:999px; padding:7px 16px; font-size:13px; font-weight:600; color:var(--muted2)}
  .cal-legend-item .sw{width:10px; height:10px; border-radius:50%; flex-shrink:0}
  .cal-list{display:grid; gap:10px}
  .cal-row{background:#fff; border:1px solid var(--border2); border-radius:14px; border-left:5px solid; padding:18px 24px; display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px 20px; align-items:center; box-shadow:0 3px 10px rgba(31,45,92,.05)}
  .cal-row .date{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:16px; color:var(--navy)}
  .cal-row .chip{display:inline-block; font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px}
  .cal-row .event{font-size:14.5px; line-height:1.55; color:var(--muted2)}
  .footnote{font-size:13.5px; color:var(--muted5); margin:24px 0 0; font-style:italic}

  /* CATALOG */
  .catalog-head{display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:12px}
  .catalog-head h2{margin:0}
  .btn-red{background:var(--red); color:#fff; font-weight:700; font-size:15px; padding:13px 26px; border-radius:999px; text-decoration:none; box-shadow:0 8px 22px rgba(232,67,45,.28); white-space:nowrap; display:inline-block}
  .btn-red:hover{background:var(--red-dark); color:#fff; text-decoration:none}
  .catalog-intro{font-size:16px; color:var(--muted3); margin:0 0 28px; max-width:820px; line-height:1.6}
  .catalog-pill{display:inline-flex; align-items:center; gap:7px; background:#fff; border:1px solid var(--border4); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:var(--muted2)}
  .catalog-pill .dot{width:7px; height:7px; border-radius:50%; background:#2E9E5B}
  .catalog-browser{background:var(--navy); border-radius:20px; overflow:hidden; box-shadow:0 18px 40px rgba(31,45,92,.22)}
  .catalog-toolbar{display:flex; align-items:center; gap:14px; padding:14px 20px}
  .catalog-dots{display:flex; gap:6px; flex-shrink:0}
  .catalog-dots span{width:11px; height:11px; border-radius:50%; display:inline-block}
  .catalog-address{flex:1; background:rgba(255,255,255,.10); border-radius:8px; padding:7px 14px; font-size:12.5px; color:#B9C4E2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .catalog-live{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:11px; letter-spacing:1.1px; color:#7FA8EE; white-space:nowrap; flex-shrink:0}
  .catalog-frame-inner{background:#fff}
  .catalog-frame-inner iframe{width:100%; height:620px; border:0; display:block}
  .catalog-tip{display:flex; align-items:flex-start; gap:12px; margin-top:16px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px 20px; font-size:14px; line-height:1.65; color:var(--muted4)}
  .catalog-tip .emoji{font-size:17px; flex-shrink:0}

  /* RULES */
  .rules-head-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:16px; margin:0 0 24px}
  .rules-head-row p{font-size:15.5px; line-height:1.6; color:var(--muted2); margin:0; max-width:640px}
  .btn-navy-pill{display:inline-flex; align-items:center; gap:10px; background:var(--navy); color:#fff; font-weight:700; font-size:14px; padding:11px 22px; border-radius:999px; text-decoration:none; white-space:nowrap}
  .btn-navy-pill:hover{background:var(--red); color:#fff; text-decoration:none}
  .cred-accordion{display:grid; gap:14px}
  .cred-item{position:relative; background:#FCFDFF; border:1.5px solid var(--border2); border-radius:18px; overflow:hidden; transition:box-shadow .2s ease, background .2s ease, border-color .2s ease; box-shadow:0 3px 12px rgba(31,45,92,.05)}
  .cred-item.open{background:#fff; border-color:#C6D6EF; box-shadow:0 14px 34px rgba(31,45,92,.13)}
  .cred-rail{position:absolute; left:0; top:0; bottom:0; width:6px}
  .cred-toggle{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:20px; width:100%; padding:22px 26px 22px 32px; cursor:pointer}
  .cred-toggle:hover{background:rgba(0,86,210,.04)}
  .cred-num{width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:20px; flex-shrink:0; background:#EDF2F9; color:var(--muted)}
  .cred-item.open .cred-num{color:#fff}
  .cred-heading{flex:1}
  .cred-heading .title{display:block; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:21px; color:var(--navy); line-height:1.2}
  .cred-heading .hint{display:block; font-size:13.5px; color:var(--muted); margin-top:3px}
  .cred-count{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:12px; letter-spacing:1.2px; color:var(--muted5); white-space:nowrap; flex-shrink:0}
  .cred-icon{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-size:18px; font-weight:700; flex-shrink:0; background:#EDF2F9; color:var(--muted)}
  .cred-item.open .cred-icon{color:#fff}
  .cred-body{padding:0 26px 24px 32px; animation:stepIn .3s ease both}
  .cred-divider{height:1px; background:var(--border2); margin-bottom:20px}
  .cred-checklist{display:grid; gap:14px}
  .cred-check-row{display:grid; grid-template-columns:26px 1fr; gap:14px; align-items:start}
  .cred-check-mark{width:22px; height:22px; border-radius:7px; color:#fff; display:grid; place-items:center; font-size:12px; font-weight:800; margin-top:2px; flex-shrink:0}
  .cred-check-text{font-size:15px; line-height:1.7; color:var(--muted2)}
  .cred-check-text strong{color:var(--navy)}
  .cred-warns{margin-top:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
  .cred-warn-box{background:#FFF9E8; border:1px solid #F0E0B0; border-radius:14px; padding:16px 20px}
  .cred-warn-box .head{display:flex; align-items:center; gap:10px; margin-bottom:7px}
  .cred-warn-box .head .emoji{font-size:16px}
  .cred-warn-box .head .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; color:#6B5518}
  .cred-warn-box .body{font-size:13.5px; line-height:1.65; color:#6B5518}
  .cred-summary-grid{margin-top:20px; display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px}
  .cred-summary-box{border-radius:18px; padding:26px 30px}
  .cred-summary-box .head{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .cred-summary-box .head .emoji{font-size:18px}
  .cred-summary-box .head .title{font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:18px}
  .cred-summary-box .body{font-size:14.5px; line-height:1.7}
  .cred-summary-box.navy{background:var(--navy)}
  .cred-summary-box.navy .head .title{color:#fff}
  .cred-summary-box.navy .body{color:#D7DDF0}
  .cred-summary-box.navy .body strong{color:#fff}
  .cred-summary-box.pink{background:#FDECE8; border:1px solid #F6C9BE}
  .cred-summary-box.pink .head .title{color:#8A2A18}
  .cred-summary-box.pink .body{color:#8A2A18}

  /* FAQ */
  .faq-tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px}
  .faq-tab{all:unset; box-sizing:border-box; cursor:pointer; display:inline-flex; align-items:center; gap:9px; background:#fff; color:var(--muted2); border:1.5px solid var(--border3); padding:11px 20px; border-radius:999px; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:14.5px}
  .faq-tab:hover{border-color:var(--navy)}
  .faq-tab.active{background:var(--navy); color:#fff; border-color:var(--navy)}
  .faq-tab .pill{background:#EDF2F9; color:var(--muted); font-size:12px; font-weight:800; padding:2px 9px; border-radius:999px}
  .faq-tab.active .pill{background:rgba(255,255,255,.22); color:#fff}
  .faq-list{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; align-items:start}
  .faq-item{background:#fff; border:1px solid var(--border); border-radius:14px; overflow:hidden}
  .faq-toggle{all:unset; box-sizing:border-box; display:flex; justify-content:space-between; align-items:center; gap:14px; width:100%; padding:16px 20px; cursor:pointer; font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:15px; line-height:1.35; color:var(--navy)}
  .faq-toggle:hover{background:#F2F6FD}
  .faq-toggle .icon{width:26px; height:26px; border-radius:50%; background:#E3EDFC; color:var(--red); display:grid; place-items:center; font-size:16px; flex-shrink:0}
  .faq-body{padding:0 20px 18px; font-size:14px; line-height:1.7; color:var(--muted4); display:none}
  .faq-item.open .faq-body{display:block}

  footer.site-footer{background:var(--navy); color:#9FABCC; padding:52px 48px; font-size:13.5px}
  .footer-inner{max-width:1080px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap}
  .footer-left{display:flex; align-items:center; gap:16px}
  .footer-logo{background:#fff; border-radius:10px; padding:7px 12px}
  .footer-logo img{height:42px; width:auto; display:block}
  .footer-left p{margin:0}
  footer.site-footer a{color:#C7D1E8}
  footer.site-footer a:hover{color:#fff}

  @media (max-width:640px){
    .rules-head-row, .catalog-head{flex-direction:column; align-items:flex-start}
    .footer-inner{flex-direction:column; align-items:flex-start; text-align:left}
  }
</style>
</head>

      { emoji: "✅", title: L("Zorunlu değerlendirmeleri kontrol et", "Check the required assessments"), text: L("Ders kapsamında tamamlanması gereken quiz, ödev, proje, sınav veya capstone çalışması bulunup bulunmadığını incele. Sertifika alabilmek için ders sayfasında belirtilen tüm zorunlu değerlendirmeleri başarıyla tamamlaman gerekir.", "Check whether the course requires quizzes, assignments, projects, exams or a capstone. To earn the certificate you must successfully complete every required assessment listed on the course page.") },
      { emoji: "🌐", title: L("Dil ve erişilebilirlik seçeneklerini değerlendir", "Consider language and accessibility"), text: L("Dersin anlatım dilinin, altyazı seçeneklerinin ve içerik seviyesinin senin için uygun olduğundan emin ol. Ders için ön koşul, özel bir yazılım veya ek materyal gerekip gerekmediğini de kontrol et.", "Make sure the language of instruction, subtitle options and content level suit you. Also check whether the course requires prerequisites, special software or extra materials.") },
      { emoji: "🧩", title: L("Program yapısını incele", "Review the program structure"), text: L("Bir Specialization veya Professional Certificate programı seçiyorsan programın kaç dersten oluştuğunu ve seçtiğin dersin tek başına sertifika sunup sunmadığını kontrol et.", "If you are choosing a Specialization or Professional Certificate, check how many courses it contains and whether the course you pick offers a certificate on its own.") }

          { b: L("Dersin özelliklerini kontrol et.", "Check the course details."), t: L("Dersin sertifika sunduğunu hem Coursera kurs kataloğundan hem de ders sayfasından kontrol et. Süresini, haftalık çalışma yükünü, zorunlu değerlendirmelerini ve peer review içerip içermediğini incele.", "Confirm the course offers a certificate, both in the Coursera catalog and on the course page. Review its length, weekly workload, required assessments and whether it includes peer review.") },

          { emoji: "⚠️", title: L("Sertifika tek başına yeterli değildir", "A certificate alone is not enough"), text: L("Sertifikanı almış olsan bile içerik etkileşim oranın %70’in altındaysa kredilendirme sürecinde sorun yaşayabilirsin. Bu veriyi öğrenciler göremez; MOOC Koordinatörleri takip eder ve %70 altına düşenlere CELT her ay bilgilendirme maili gönderir.", "Even if you have earned the certificate, you may run into problems during crediting if your content engagement is below 70%. Students cannot see this data; MOOC Coordinators track it, and CELT sends a monthly information e-mail to students below 70%.") }

    var FAQ_GROUP_DEFS = [
      { title: L("PLE Programı ve Kredilendirme", "PLE Program and Crediting"), items: [
        { q: L("Coursera lisans talebinde nasıl bulunabilirim?", "How do I request a Coursera licence?"), a: L("CELT, Coursera sürecine ilişkin takvimi her dönem ilan eder. İlan edilen tarihler arasında <b>MOOC Lisans Talep Formu'nu</b> doldurman gerekir. Talepler, mevcut kontenjanlar ve program esasları doğrultusunda değerlendirilir.", "CELT announces the calendar for the Coursera process each term. You need to fill in the <b>MOOC Licence Request Form</b> within the announced dates. Requests are assessed according to available seats and the program principles.") },
        { q: L("Kontenjan dağıtımında kimlere öncelik verilir?", "Who has priority in seat allocation?"), a: L("Lisans dağıtımında mezuniyet aşamasındaki 4. sınıf öğrencilerine öncelik verilir. Lisans talep formunu doldurmak, Coursera lisansının kesin olarak tahsis edileceği anlamına gelmez.", "Priority in licence distribution is given to graduating 4th-year students. Filling in the request form does not guarantee that a Coursera licence will be allocated to you.") },
        { q: L("Bu dönem Coursera lisansı alamazsam ne yapabilirim?", "What if I do not receive a licence this term?"), a: L("Bir sonraki dönemde yeniden lisans talebinde bulunabilirsin. Coursera lisans talep süreci Güz, Bahar ve Yaz dönemlerinde yürütülür.", "You can submit a new licence request next term. The Coursera licence request process runs in the Fall, Spring and Summer terms.") },
        { q: L("PLE kapsamında kredilendireceğim dersi nasıl seçmeliyim?", "How should I choose a course to be credited under PLE?"), a: L("Öncelikle bölümünün web sitesinde yayımlanan <b>MOOC/PLE ders listesini ve kredilendirme yönergelerini</b> incele. Bölümün uygun dersleri web sitesinde yayımlıyorsa seçimini bu listeye göre yap. Ders listesi bulunmuyorsa veya seçtiğin dersin uygunluğundan emin değilsen bölümünün MOOC Koordinatörüne danış.<br><br>Ayrıca dersin sertifika sunduğunu, tahminî tamamlanma süresini, zorunlu değerlendirmelerini ve peer review içerip içermediğini kontrol et.", "First review the <b>MOOC/PLE course list and crediting guidelines</b> published on your department’s website. If your department publishes eligible courses there, choose from that list. If there is no list, or you are unsure about eligibility, consult your department’s MOOC Coordinator.<br><br>Also check that the course offers a certificate, and review its estimated duration, required assessments and whether it includes peer review.") },
        { q: L("Her Coursera dersi PLE kredisine dönüşür mü?", "Does every Coursera course become PLE credit?"), a: L("Hayır. Coursera'da bir dersi tamamlamak ve sertifika almak, dersin otomatik olarak PLE kredisine dönüşeceği anlamına gelmez. Dersin bölümünün PLE yönergelerine uygun olması ve ilgili akademik değerlendirme sürecinin tamamlanması gerekir.", "No. Completing a course on Coursera and earning a certificate does not automatically turn it into PLE credit. The course must comply with your department’s PLE guidelines and the relevant academic assessment must be completed.") },
        { q: L("Sertifika sunmayan bir dersi kredilendirebilir miyim?", "Can a course without a certificate be credited?"), a: L("Hayır. PLE kapsamında kredilendirilecek dersin, başarıyla tamamlandığında Coursera sertifikası sunması gerekir. Sertifika bilgisini hem Coursera kurs kataloğundan hem de Coursera'daki ders sayfasından kontrol edebilirsin.<br><br>Sertifika sunmayan içerikleri kişisel ve mesleki gelişimin için tamamlayabilirsin; ancak bu içerikler PLE kapsamında kredilendirilemez.", "No. A course to be credited under PLE must provide a Coursera certificate upon successful completion. You can check this in the Coursera course catalog and on the course page on Coursera.<br><br>You may complete content without a certificate for personal and professional development, but it cannot be credited under PLE.") },
        { q: L("En fazla kaç AKTS kredilendirebilirim?", "What is the maximum ECTS I can have credited?"), a: L("Öğrenimin boyunca PLE kapsamında toplam en fazla <b>12 AKTS</b> kredilendirebilirsin. Bir MOOC dersinin AKTS karşılığı bölüm tarafından belirlendiği için 12 AKTS'nin karşılık geldiği ders sayısı bölümlere göre değişebilir.", "Over the course of your studies, a maximum of <b>12 ECTS</b> in total can be credited under PLE. Because the ECTS value of a MOOC course is set by the department, the number of courses 12 ECTS corresponds to may vary.") },
        { q: L("12 AKTS sınırına ulaştıktan sonra Coursera dersi alabilir miyim?", "Can I keep taking Coursera courses after reaching 12 ECTS?"), a: L("Evet. Coursera derslerine kişisel ve mesleki gelişimin için devam edebilirsin; ancak 12 AKTS sınırına ulaştıktan sonra tamamladığın yeni dersleri PLE kredisi olarak saydıramazsın.", "Yes. You can continue taking Coursera courses for personal and professional development; however, once you reach the 12 ECTS limit, new courses cannot be counted as PLE credit.") },
        { q: L("Bir dersi tamamlamış sayılmam nasıl belirlenir?", "How is course completion determined?"), a: L("Coursera sertifikasını alabilmek için ders kapsamında zorunlu olan tüm değerlendirmeleri başarıyla tamamlaman gerekir. PLE kredilendirmesi için ayrıca içerik etkileşim oranının <b>en az %70</b> olması, Coursera sertifikanın alınması ve sunum kaydının bölümüne teslim edilmesi gerekir. <a href=\"https://www.coursera.support/s/article/learner-000001563\" target=\"_blank\" rel=\"noopener\">Coursera: Değerlendirmeleri tamamlama ↗</a>", "To earn the Coursera certificate you must successfully complete all required assessments. For PLE crediting, your content engagement must also be <b>at least 70%</b>, you must obtain the Coursera certificate, and you must submit the presentation recording to your department. <a href=\"https://www.coursera.support/s/article/learner-000001563\" target=\"_blank\" rel=\"noopener\">Coursera: Completing assessments ↗</a>") },
        { q: L("%70 içerik etkileşimi ne anlama gelir?", "What does 70% content engagement mean?"), a: L("İçerik etkileşimi; ders videolarını izleme, okuma materyallerini inceleme ve quiz, ödev ve değerlendirme etkinliklerini tamamlama durumuna göre hesaplanır. PLE kapsamında kredilendirilecek her ders için içerik etkileşim oranının en az %70 olması gerekir.<br><br>Dersi yalnızca hızlıca geçmek veya bazı içerikleri atlayarak sertifika almak, yeterli içerik etkileşiminin oluşmasını sağlamayabilir.", "Content engagement is calculated from watching course videos, reviewing reading materials and completing quizzes, assignments and assessment activities. For every course to be credited under PLE, engagement must be at least 70%.<br><br>Rushing through a course or earning the certificate while skipping content may not produce sufficient engagement.") },
        { q: L("Kendi içerik etkileşim verimi görebilir miyim?", "Can I see my own engagement data?"), a: L("Öğrenciler içerik etkileşim verisini doğrudan görüntüleyemez. Bu veri MOOC Koordinatörleri tarafından takip edilir. Etkileşim oranın %70'in altında kalırsa CELT tarafından her ay bilgilendirme maili gönderilir.", "Students cannot view content engagement data directly. It is tracked by MOOC Coordinators. If your engagement falls below 70%, CELT sends a monthly information e-mail.") },
        { q: L("Peer review nedir ve neden önemlidir?", "What is peer review and why does it matter?"), a: L("Peer review, yüklediğin bir ödevin diğer Coursera öğrencileri tarafından belirlenen ölçütlere göre değerlendirilmesidir. Bazı derslerde sertifika alabilmek için peer review ödevini teslim etmen, gerekli sayıda öğrenci ödevini değerlendirmen ve kendi çalışman için değerlendirme alman gerekir. <a href=\"https://www.coursera.support/s/article/learner-000001352\" target=\"_blank\" rel=\"noopener\">Coursera: Peer review ödevleri ↗</a><br><br>Değerlendirme süreci genellikle <b>7–14 gün</b> sürebilir ve yeterli değerlendirme alınamadığında uzayabilir. Bu nedenle peer review ödevlerini bölümünün sertifika teslim tarihine bırakmamalısın.", "Peer review means an assignment you submit is graded by other Coursera learners against set criteria. In some courses, to earn the certificate you must submit the peer-reviewed assignment, review the required number of other learners’ submissions, and receive reviews for your own. <a href=\"https://www.coursera.support/s/article/learner-000001352\" target=\"_blank\" rel=\"noopener\">Coursera: Peer-reviewed assignments ↗</a><br><br>The review process usually takes <b>7–14 days</b> and can take longer if not enough reviews come in. For this reason, do not leave peer review assignments until your department’s certificate deadline.") },
        { q: L("Dönem sonunda ne teslim etmem gerekiyor?", "What do I submit at the end of the term?"), a: L("Tamamladığın her MOOC dersi için aşağıdaki iki belgeyi bölümünün MOOC Koordinatörüne teslim etmelisin:<br><br>1. Coursera ders sertifikası<br>2. Dersin ana fikrini ve öğrendiklerini anlattığın <b>2–5 dakikalık sunum kaydı</b>", "For each MOOC course you complete, submit the following two documents to your department’s MOOC Coordinator:<br><br>1. The Coursera course certificate<br>2. A <b>2–5 minute presentation recording</b> explaining the main idea of the course and what you learned") },
        { q: L("Sertifika ve sunum kaydı için son teslim tarihini nereden öğrenebilirim?", "Where do I find the submission deadline?"), a: L("Teslim tarihleri ve teslim yöntemi bölümler tarafından belirlenir ve bölümlere göre farklılık gösterebilir. Güncel teslim tarihini bölümünün web sitesinden, bölüm duyurularından veya MOOC Koordinatöründen öğrenmelisin.<br><br>Coursera'daki esnek ders tarihleri, bölümünün belirlediği sertifika teslim tarihini değiştirmez.", "Deadlines and submission methods are set by departments and may vary. Find the current deadline on your department’s website, in departmental announcements, or from your MOOC Coordinator.<br><br>Flexible course dates on Coursera do not change the certificate deadline set by your department.") },
        { q: L("GE kodu transkriptime ne zaman işlenir?", "When does the GE code appear on my transcript?"), a: L("Belgelerinin kontrol edilmesi, bölüm değerlendirmesi ve ilgili akademik onayların tamamlanmasının ardından PLE kredin transkriptine işlenir. <b>“GE”</b> ders kodu dönem sonunda veya takip eden dönemde transkriptinde görünebilir.<br><br>Eksik veya hatalı bir bilgi olduğunu düşünüyorsan bölümünün MOOC Koordinatörüyle iletişime geçebilirsin.", "After your documents have been checked and the departmental assessment and academic approvals are complete, your PLE credit is recorded on your transcript. The <b>“GE”</b> course code may appear at the end of the term or in the following term.<br><br>If you think something is missing or incorrect, contact your department’s MOOC Coordinator.") },
        { q: L("Endüstri Mühendisliği öğrencileri yaz döneminde PLE yapabilir mi?", "Can Industrial Engineering students do PLE in the summer?"), a: L("Coursera yaz döneminde de erişime açılır; ancak Endüstri Mühendisliği Bölümü öğrencilerinin yaz döneminde tamamladıkları Coursera dersleri PLE kapsamında kredilendirilemez. Yaz döneminde Coursera derslerine kişisel ve mesleki gelişim amacıyla devam edilebilir.", "Coursera is also available in the summer term; however, Coursera courses completed in the summer term by Industrial Engineering students cannot be credited under PLE. You may still continue with Coursera courses for personal and professional development.") },
        { q: L("PLE Programı’nın resmî esaslarına nereden ulaşabilirim?", "Where can I find the official PLE principles?"), a: L("Kredilendirme sürecinin resmî dayanağına aşağıdaki belgeden ulaşabilirsin:<br><br><b>PLE Programı Esasları – MEF Üniversitesi Senato Kararı (2019)</b> — Kredilendirme sekmesindeki bağlantıdan açabilirsin.", "You can find the official basis of the crediting process in the following document:<br><br><b>PLE Program Principles – MEF University Senate Resolution (2019)</b> — open it from the link in the Crediting tab.") },
        { q: L("CELT'e mi, MOOC Koordinatörüme mi yazmalıyım?", "Should I write to CELT or my MOOC Coordinator?"), a: L("<b>CELT:</b> Coursera lisans talebi, lisans dağıtımı, Coursera erişimi ve içerik etkileşim uyarıları için <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a> adresine yazabilirsin.<br><br><b>Bölüm veya MOOC Koordinatörü:</b> Ders seçimi, PLE uygunluğu, AKTS eşleştirmesi, sertifika ve sunum kaydı teslimi ile kredilendirme süreçleri için bölümüne başvurmalısın.<br><br><b>Coursera Destek:</b> Kilitli değerlendirmeler, eksik sertifika, isim veya kimlik doğrulama ve hesap birleştirme gibi platform kaynaklı teknik sorunlar için <a href='https://www.coursera.support/s/learner-help-center' target='_blank' rel='noopener'>Coursera Learner Help Center ↗</a> üzerinden destek alabilirsin.", "<b>CELT:</b> For Coursera licence requests, licence assignment, Coursera access and content engagement warnings, write to <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a>.<br><br><b>Your department or MOOC Coordinator:</b> For course selection, PLE eligibility, ECTS matching, certificate and presentation submission, and crediting, contact your department.<br><br><b>Coursera Support:</b> For platform issues such as locked assessments, missing certificates, name or ID verification and account merging, get help via the <a href='https://www.coursera.support/s/learner-help-center' target='_blank' rel='noopener'>Coursera Learner Help Center ↗</a>.") }
      ]},
      { title: L("Coursera Kullanımı ve Teknik Sorular", "Using Coursera and Technical Questions"), items: [
        { q: L("Coursera hesabıma nasıl giriş yapmalıyım?", "How do I sign in to my Coursera account?"), a: L("Coursera lisansının tanımlandığı <b>MEF uzantılı mail adresini</b> kullanmalısın. Coursera giriş ekranında <b>“Google ile devam et”</b> seçeneğini seçerek MEF Google hesabınla giriş yapabilirsin.<br><br>Daha önce farklı bir giriş yöntemi kullandıysan doğru Coursera hesabında olduğundan emin ol. Coursera, Google hesabının mevcut Coursera hesabına bağlanmasına izin verir. <a href='https://www.coursera.support/s/article/learner-000001888' target='_blank' rel='noopener'>Coursera: Google hesabıyla giriş ↗</a>", "Use the <b>MEF e-mail address</b> your Coursera licence was assigned to. On the Coursera sign-in screen, choose <b>“Continue with Google”</b> to sign in with your MEF Google account.<br><br>If you previously used a different sign-in method, make sure you are in the correct Coursera account. Coursera allows linking your Google account to an existing Coursera account. <a href='https://www.coursera.support/s/article/learner-000001888' target='_blank' rel='noopener'>Coursera: Signing in with Google ↗</a>") },
        { q: L("Coursera lisansım tanımlandı ancak dersler ücretli görünüyor. Ne yapmalıyım?", "My licence is assigned but courses still show as paid. What now?"), a: L("Öncelikle MEF uzantılı mail adresinin bağlı olduğu doğru Coursera hesabında bulunduğunu kontrol et. Kişisel Coursera hesabınla giriş yaptıysan MEF lisansına dâhil içerikler ücretli görünebilir.<br><br>Herhangi bir ödeme yapmadan önce hesabından çıkış yaparak <b>“Google ile devam et”</b> seçeneğiyle MEF hesabına yeniden giriş yap. Sorun devam ederse ekran görüntüsüyle birlikte <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a> adresine yaz.", "First check that you are in the correct Coursera account linked to your MEF e-mail address. If you signed in with a personal Coursera account, content covered by the MEF licence may appear as paid.<br><br>Before making any payment, sign out and sign back in to your MEF account using <b>“Continue with Google”</b>. If the problem persists, write to <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a> with a screenshot.") },
        { q: L("Bir dersin sertifika verip vermediğini nasıl kontrol edebilirim?", "How do I check whether a course offers a certificate?"), a: L("Sertifika bilgisini Coursera kurs kataloğundan ve Coursera'daki ders sayfasından kontrol edebilirsin. Ders sayfasında sertifika sunulduğuna ilişkin bilgi bulunmuyorsa dersi PLE amacıyla seçmemelisin.<br><br>Bir Specialization veya Professional Certificate programı seçiyorsan programın kaç dersten oluştuğunu ve seçtiğin dersin tek başına sertifika sunup sunmadığını da kontrol et.", "Check the certificate information in the Coursera course catalog and on the course page on Coursera. If the course page does not indicate a certificate, do not choose it for PLE purposes.<br><br>If you are choosing a Specialization or Professional Certificate, also check how many courses it contains and whether your chosen course offers a certificate on its own.") },
        { q: L("Coursera sertifikası alabilmek için ne yapmalıyım?", "What do I need to do to earn a Coursera certificate?"), a: L("Ders kapsamında zorunlu olan tüm notlandırılmış quizleri, ödevleri, projeleri ve sınavları başarıyla tamamlamalısın. Peer review zorunluysa bu değerlendirme de tamamlanmadan sertifikan oluşturulmayabilir. Coursera ayrıca isim doğrulaması; bazı ders ve programlarda ise kimlik doğrulaması isteyebilir. <a href='https://www.coursera.support/s/article/learner-000001268' target='_blank' rel='noopener'>Coursera: Sertifika alma koşulları ↗</a>", "You must successfully complete all required graded quizzes, assignments, projects and exams. If peer review is required, your certificate may not be issued until that review is complete. Coursera may also require name verification, and ID verification for some courses and programs. <a href='https://www.coursera.support/s/article/learner-000001268' target='_blank' rel='noopener'>Coursera: Certificate requirements ↗</a>") },
        { q: L("Sertifikamı nereden indirebilirim?", "Where can I download my certificate?"), a: L("Coursera hesabına giriş yaptıktan sonra <b>My Learning</b> bölümünü aç ve <b>Certificates</b> sekmesine git. Buradan kazandığın sertifikayı görüntüleyebilir, indirebilir veya paylaşabilirsin. <a href='https://www.coursera.support/s/article/learner-000001329' target='_blank' rel='noopener'>Coursera: Sertifika indirme ve paylaşma ↗</a><br><br>Sertifikanı hangi formatta teslim etmen gerektiğini bölümünün duyurularından veya MOOC Koordinatöründen öğrenmelisin.", "After signing in to Coursera, open <b>My Learning</b> and go to the <b>Certificates</b> tab. From there you can view, download or share your certificate. <a href='https://www.coursera.support/s/article/learner-000001329' target='_blank' rel='noopener'>Coursera: Downloading and sharing certificates ↗</a><br><br>Find out the required submission format from your department’s announcements or your MOOC Coordinator.") },
        { q: L("Dersi tamamladım ancak sertifikam oluşmadı. Ne yapmalıyım?", "I finished the course but no certificate was issued. What should I do?"), a: L("Öncelikle aşağıdakileri kontrol et:<br><br>• Tüm zorunlu ve notlandırılmış değerlendirmeleri geçtin mi?<br>• Bekleyen bir peer review ödevin var mı?<br>• Gerekli sayıda öğrenci ödevini değerlendirdin mi?<br>• İsim veya kimlik doğrulaman tamamlandı mı?<br>• Dersi MEF lisansının tanımlı olduğu doğru Coursera hesabında mı tamamladın?<br><br>Sorun devam ederse <a href='https://www.coursera.support/s/article/learner-000001456' target='_blank' rel='noopener'>Coursera'nın sertifika sorunları rehberini ↗</a> incele ve Coursera Destek ile iletişime geç. Bölümünün teslim tarihi yaklaşıyorsa durumu ekran görüntüleriyle birlikte CELT'e ve MOOC Koordinatörüne bildir.", "First check the following:<br><br>• Have you passed all required graded assessments?<br>• Is a peer review assignment still pending?<br>• Have you reviewed the required number of other learners’ submissions?<br>• Is your name or ID verification complete?<br>• Did you complete the course in the Coursera account your MEF licence is assigned to?<br><br>If the problem persists, review <a href='https://www.coursera.support/s/article/learner-000001456' target='_blank' rel='noopener'>Coursera’s certificate troubleshooting guide ↗</a> and contact Coursera Support. If your department’s deadline is approaching, inform CELT and your MOOC Coordinator with screenshots.") },
        { q: L("Peer review ödevim değerlendirilmiyor. Ne yapabilirim?", "My peer review assignment is not being graded. What can I do?"), a: L("Ödevini doğru şekilde gönderdiğini ve sistemin istediği sayıda öğrenci ödevini değerlendirdiğini kontrol et. Değerlendirme beklerken dersin tartışma alanında diğer öğrencilerden çalışmanı değerlendirmelerini isteyebilirsin.<br><br>Sorun devam ederse <a href='https://www.coursera.support/s/article/learner-000001477' target='_blank' rel='noopener'>Coursera'nın peer review sorun giderme adımlarını ↗</a> takip et. Bölümünün sertifika teslim tarihinin değişmediğini unutma.", "Check that you submitted your assignment correctly and reviewed the required number of other learners’ submissions. While waiting, you can ask other learners in the course discussion forum to review your work.<br><br>If the problem persists, follow <a href='https://www.coursera.support/s/article/learner-000001477' target='_blank' rel='noopener'>Coursera’s peer review troubleshooting steps ↗</a>. Remember that your department’s certificate deadline does not change.") },
        { q: L("Sertifikamda ismim yanlış görünüyor. Nasıl düzeltebilirim?", "My name is wrong on the certificate. How do I fix it?"), a: L("Coursera sertifikalarında hesabındaki <b>doğrulanmış isim</b> kullanılır. Coursera hesabında <b>Settings</b> bölümüne giderek isim doğrulama alanını kontrol et. Doğrulanmış isminin resmî belgelerindeki adınla eşleşmesi gerekir. <a href='https://www.coursera.support/s/article/learner-000002203' target='_blank' rel='noopener'>Coursera: Doğrulanmış ismi güncelleme ↗</a><br><br>Sertifikanı bölümüne teslim etmeden önce isim bilgisinin doğru olduğundan emin ol.", "Coursera certificates use the <b>verified name</b> on your account. Go to <b>Settings</b> in your Coursera account and check the name verification field. Your verified name must match the name on your official documents. <a href='https://www.coursera.support/s/article/learner-000002203' target='_blank' rel='noopener'>Coursera: Updating your verified name ↗</a><br><br>Make sure the name is correct before submitting your certificate to your department.") },
        { q: L("Coursera neden isim veya kimlik doğrulaması istiyor?", "Why does Coursera ask for name or ID verification?"), a: L("Coursera, sertifikanın doğru kişiye düzenlenebilmesi için isim doğrulaması ister. Çoğu derste isim doğrulaması yeterliyken bazı ders ve programlarda kimlik doğrulaması da gerekebilir. <a href='https://www.coursera.support/s/article/learner-000001457' target='_blank' rel='noopener'>Coursera: İsim doğrulama ↗</a> ve <a href='https://www.coursera.support/s/article/learner-000001213' target='_blank' rel='noopener'>kimlik doğrulama ↗</a> adımlarını Coursera üzerinden tamamlayabilirsin.<br><br>Doğrulama sırasında teknik bir sorun yaşarsan kimlik belgeni CELT'e göndermek yerine Coursera Destek ile iletişime geç. Sorun bölümünün teslim tarihini etkiliyorsa CELT'i ve MOOC Koordinatörünü ayrıca bilgilendir.", "Coursera requires name verification so the certificate is issued to the right person. Name verification is enough for most courses, while some courses and programs also require ID verification. You can complete <a href='https://www.coursera.support/s/article/learner-000001457' target='_blank' rel='noopener'>name verification ↗</a> and <a href='https://www.coursera.support/s/article/learner-000001213' target='_blank' rel='noopener'>ID verification ↗</a> through Coursera.<br><br>If you hit a technical problem during verification, contact Coursera Support rather than sending your ID document to CELT. If the issue affects your department’s deadline, also inform CELT and your MOOC Coordinator.") },
        { q: L("Coursera’daki ders teslim tarihini kaçırırsam ne olur?", "What if I miss a deadline on Coursera?"), a: L("Bazı Coursera derslerinde kaçırılan değerlendirme tarihleri yeniden planlanabilir veya sistem tarafından sıfırlanabilir. Ancak Coursera'daki tarihin değişmesi, bölümünün Coursera sertifikası ve sunum kaydı için belirlediği teslim tarihini uzatmaz. <a href='https://www.coursera.support/s/article/learner-000001570' target='_blank' rel='noopener'>Coursera: Değerlendirme tarihleri ↗</a>", "In some Coursera courses, missed assessment deadlines can be rescheduled or reset by the system. However, a change on Coursera does not extend the deadline your department has set for the certificate and presentation recording. <a href='https://www.coursera.support/s/article/learner-000001570' target='_blank' rel='noopener'>Coursera: Assessment deadlines ↗</a>") },
        { q: L("Birden fazla Coursera hesabım varsa ne yapmalıyım?", "What if I have more than one Coursera account?"), a: L("Derslerinin, ilerleme bilgilerinin ve sertifikalarının farklı hesaplara dağılmaması için MEF lisansının tanımlı olduğu hesabı kullanmaya devam et. Coursera, uygun durumlarda birden fazla hesabı birleştirme konusunda destek sağlayabilir. <a href='https://www.coursera.support/s/article/learner-000001500' target='_blank' rel='noopener'>Coursera: Birden fazla hesabı birleştirme ↗</a><br><br>Hesaplarını kendi başına silmeden veya yeni bir hesap oluşturmadan önce Coursera Destek ile iletişime geç.", "Keep using the account your MEF licence is assigned to, so your courses, progress and certificates are not spread across accounts. Where applicable, Coursera can help merge multiple accounts. <a href='https://www.coursera.support/s/article/learner-000001500' target='_blank' rel='noopener'>Coursera: Merging multiple accounts ↗</a><br><br>Contact Coursera Support before deleting accounts or creating a new one on your own.") },
        { q: L("Seçtiğim ders Coursera kataloğundan kaldırılırsa ne yapmalıyım?", "What if my course is removed from the Coursera catalog?"), a: L("Coursera kurs kataloğu zaman içinde değişebilir. Derse başlamadan önce dersin güncel katalogda bulunduğunu ve erişilebilir olduğunu kontrol et.<br><br>Ders katalogdan kaldırılmışsa veya erişime kapanmışsa başka bir ders seçmeden önce bölümünün web sitesindeki güncel listeyi incele. Dersin PLE uygunluğu konusunda belirsizlik varsa MOOC Koordinatörüne danış.", "The Coursera course catalog can change over time. Before starting a course, check that it is in the current catalog and accessible.<br><br>If the course has been removed or closed, review the current list on your department’s website before choosing another. If PLE eligibility is unclear, consult your MOOC Coordinator.") },
        { q: L("Coursera’da teknik bir sorun yaşarsam nereye başvurmalıyım?", "Where do I go for technical problems on Coursera?"), a: L("Öncelikle <a href='https://www.coursera.support/s/learner-help-center' target='_blank' rel='noopener'>Coursera Learner Help Center ↗</a> üzerindeki ilgili sorun giderme adımlarını incele. Çözüm bulamazsan Coursera Destek ekibiyle iletişime geçebilirsin.<br><br>Sorun MEF lisansının hesabına tanımlanmaması, Coursera erişimin veya CELT tarafından gönderilen etkileşim uyarısıyla ilgiliyse <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a> adresine yaz. Ders seçimi, sertifika teslimi veya kredilendirme ile ilgiliyse bölümünün MOOC Koordinatörüne başvur.", "First review the relevant troubleshooting steps in the <a href='https://www.coursera.support/s/learner-help-center' target='_blank' rel='noopener'>Coursera Learner Help Center ↗</a>. If that does not resolve it, contact Coursera Support.<br><br>If the issue concerns your MEF licence not being assigned to your account, your Coursera access, or an engagement warning sent by CELT, write to <a href='mailto:celt@mef.edu.tr'>celt@mef.edu.tr</a>. If it concerns course selection, certificate submission or crediting, contact your department’s MOOC Coordinator.") }
      ]}
    ];
    var faqCat = STATE.faqCat;
    var faqTabs = FAQ_GROUP_DEFS.map(function(g, gi){ return { title: g.title, count: g.items.length, active: faqCat === gi }; });
    var faqItems = (FAQ_GROUP_DEFS[faqCat] || FAQ_GROUP_DEFS[0]).items.map(function(item, i){
      return { q: item.q, a: item.a, open: STATE.openFaq === i };
    });

    /* ---- apply to DOM ---- */
    renderNav(t, TAB_DEFS);
    renderHero(t, currentStepLabel);
    renderProcess(t, steps, stepSel, currentStepLabel, checklist);
    renderCalendar(t, calCategories, calendar);
    renderCatalog(t);
    renderRules(t, credSteps);
    renderDepartments(t, faculties);
    renderFaq(t, faqTabs, faqItems);
    renderFooter(t);
    applyTab();
  }

  function applyTab(){
    var key = panels[STATE.tab] ? STATE.tab : "home";
    Object.keys(panels).forEach(function(k){ panels[k].style.display = (k === key) ? "" : "none"; });
    document.querySelectorAll(".nav-btn").forEach(function(b){ b.classList.toggle("active", b.dataset.tabKey === key); });
    document.documentElement.lang = STATE.lang;
  }

  function renderNav(t, TAB_DEFS){
    els.navBrand.textContent = t.brand;
    els.navLinks.innerHTML = TAB_DEFS.map(function(d){
      return "<button type=\"button\" class=\"nav-btn\" data-tab-key=\"" + d.key + "\" data-action=\"tab:" + d.key + "\">" + d.label + "</button>";
    }).join("");
    els.langToggle.innerHTML =
      "<button type=\"button\" class=\"lang-btn" + (STATE.lang === "tr" ? " active" : "") + "\" data-action=\"lang:tr\">TR</button>" +
      "<button type=\"button\" class=\"lang-btn" + (STATE.lang === "en" ? " active" : "") + "\" data-action=\"lang:en\">EN</button>";
  }

  function renderHero(t, currentStepLabel){
    els.heroInner.innerHTML =
      "<div class=\"hero-badge\"><span class=\"dot\"></span>" + t.term + " · " + currentStepLabel + "</div>" +
      "<h1>" + t.heroA + " <span class=\"accent\">" + t.heroB + "<span class=\"underline\"></span></span></h1>" +
      "<div class=\"hero-cards\">" +
        "<a href=\"" + LINKS.applicationForm + "\" target=\"_blank\" rel=\"noopener\" class=\"hero-card red\">" +
          "<span class=\"emoji\">📝</span><span class=\"title\">" + t.card1Title + "</span><span class=\"desc\">" + t.card1Desc + "</span><span class=\"cta\">" + t.card1Cta + "</span></a>" +
        "<a href=\"#catalog\" data-action=\"tab:catalog\" class=\"hero-card white\">" +
          "<span class=\"emoji\">🎓</span><span class=\"title\">" + t.card2Title + "</span><span class=\"desc\">" + t.card2Desc + "</span><span class=\"cta\">" + t.card2Cta + "</span></a>" +
        "<a href=\"#process\" data-action=\"tab:process\" class=\"hero-card navy\">" +
          "<span class=\"emoji\">🧭</span><span class=\"title\">" + t.card3Title + "</span><span class=\"desc\">" + t.card3Desc + "</span><span class=\"cta\">" + t.card3Cta + "</span></a>" +
      "</div>";
  }

  var NOTE_STYLES = {
    red: { bg: "#FDECE8", border: "#F6C9BE", color: "#8A2A18" },
    yellow: { bg: "#FFF9E8", border: "#F0E0B0", color: "#6B5518" },
    green: { bg: "#EAF6EF", border: "#BFE3CD", color: "#1D5C38" }
  };

  function renderProcess(t, steps, stepSel, currentStepLabel, checklist){
    var railHtml = steps.map(function(s, i){
      var sel = i === stepSel;
      var cls = "rail-btn" + (s.done ? " done" : "") + (s.isCurrent ? " current" : "") + (sel ? " selected" : "");
      return "<button type=\"button\" class=\"" + cls + "\" data-action=\"rail:" + i + "\">" +
        "<span class=\"circle\">" + (s.done ? "✓" : String(i + 1)) + "</span>" +
        "<span class=\"label\">" + s.railLabel + "</span></button>";
    }).join("");

    var s = steps[stepSel];
    var cardCls = "step-card" + (s.isCurrent ? " current" : (s.done ? " done" : ""));
    var badges = "<span class=\"step-eyebrow\">" + t.stepWord + " " + (s.idx + 1) + "</span>";
    if (s.isCelt) badges += "<span class=\"tag-chip celt\">CELT</span>";
    if (s.isCoord) badges += "<span class=\"tag-chip coord\">" + t.badgeCoord + "</span>";
    if (s.isStudentAffairs) badges += "<span class=\"tag-chip student\">" + t.badgeSa + "</span>";
    if (s.isCurrent) badges += "<span class=\"tag-chip current\">" + t.badgeCurrent + "</span>";
    else if (s.done) badges += "<span class=\"tag-chip done\">" + t.badgeDone + "</span>";

    var body = "";
    if (s.hasChecklist) {
      var open = STATE.checklistOpen;
      body += "<div class=\"checklist-panel " + (open ? "open" : "closed") + "\">" +
        "<button type=\"button\" class=\"checklist-toggle\" data-action=\"checklist:toggle\">" +
          "<span class=\"title\">" + t.checklistTitle + "</span>" +
          "<span class=\"meta\"><span class=\"count\">" + t.checklistCount + "</span><span class=\"icon\">" + (open ? "−" : "+") + "</span></span></button>" +
        "<div class=\"checklist-items\">" +
          checklist.map(function(c){
            return "<div class=\"checklist-item\"><span class=\"no\">" + c.no + "</span><span><span class=\"ctitle\">" + c.emoji + " " + c.title + "</span><span class=\"ctext\">" + c.text + "</span></span></div>";
          }).join("") +
        "</div></div>";
    }
    body += "<div class=\"step-desc\">" + s.desc + "</div>";

    var note = "";
    if (s.noteText) {
      var ns = NOTE_STYLES[s.noteType];
      note = "<div class=\"step-note\" style=\"background:" + ns.bg + "; border-color:" + ns.border + "; color:" + ns.color + "\">" +
        "<span class=\"emoji\">" + s.noteEmoji + "</span><span class=\"text\"><strong>" + s.noteLabel + "</strong> " + s.noteText + "</span></div>";
    }
    var link = "";
    if (s.linkUrl) {
      link = "<a class=\"step-link\" href=\"" + s.linkUrl + "\" target=\"_blank\" rel=\"noopener\">" +
        "<span class=\"emoji\">" + s.linkEmoji + "</span><span class=\"title\">" + s.linkTitle + "</span><span class=\"arrow\">↗</span></a>";
    }

    els.processWrap.innerHTML =
      "<div class=\"eyebrow\">" + t.processEyebrow + "</div>" +
      "<div class=\"process-heading-row\"><h2 class=\"h2\">" + t.processTitleA + " <span class=\"accent\">" + t.processTitleB + "</span></h2>" +

  function renderCalendar(t, calCategories, calendar){
    els.calendarWrap.innerHTML =
      "<div class=\"eyebrow\">" + t.calEyebrow + "</div>" +
      "<h2 class=\"h2\">" + t.calTitle + "</h2>" +
      "<p class=\"catalog-intro\" style=\"margin-bottom:32px\">" + t.calIntro + "</p>" +
      "<div class=\"cal-legend\">" + calCategories.map(function(c){
        return "<div class=\"cal-legend-item\"><span class=\"sw\" style=\"background:" + c.color + "\"></span>" + c.label + "</div>";
      }).join("") + "</div>" +
      "<div class=\"cal-list\">" + calendar.map(function(ev){
        return "<div class=\"cal-row\" style=\"border-left-color:" + ev.color + "\"><div class=\"date\">" + ev.date + "</div>" +
          "<div><span class=\"chip\" style=\"background:" + ev.chipBg + "; color:" + ev.color + "\">" + ev.category + "</span></div>" +
          "<div class=\"event\">" + ev.event + "</div></div>";

      "<p class=\"footnote\">" + t.calFoot + "</p>";

  function renderRules(t, credSteps){
    var accHtml = credSteps.map(function(c, i){
      var itemsHtml = c.items.map(function(it){
        return "<div class=\"cred-check-row\"><span class=\"cred-check-mark\" style=\"background:" + c.rail + "\">✓</span>" +
          "<span class=\"cred-check-text\"><strong>" + it.b + "</strong> " + it.t + "</span></div>";
      }).join("");
      var warnsHtml = "";
      if (c.hasWarn) {
        warnsHtml = "<div class=\"cred-warns\">" + c.warns.map(function(w){
          return "<div class=\"cred-warn-box\"><div class=\"head\"><span class=\"emoji\">" + w.emoji + "</span><span class=\"title\">" + w.title + "</span></div><div class=\"body\">" + w.text + "</div></div>";
        }).join("") + "</div>";
      }
      var bodyHtml = c.open ? ("<div class=\"cred-body\"><div class=\"cred-divider\"></div><div class=\"cred-checklist\">" + itemsHtml + "</div>" + warnsHtml + "</div>") : "";
      return "<div class=\"cred-item" + (c.open ? " open" : "") + "\">" +
        "<div class=\"cred-rail\" style=\"background:" + c.rail + "\"></div>" +
        "<button type=\"button\" class=\"cred-toggle\" data-action=\"cred:" + i + "\">" +
          "<span class=\"cred-num\"" + (c.open ? " style=\"background:" + c.rail + "\"" : "") + ">" + c.no + "</span>" +
          "<span class=\"cred-heading\"><span class=\"title\">" + c.title + "</span><span class=\"hint\">" + c.hint + "</span></span>" +
          "<span class=\"cred-count\">" + c.count + "</span>" +
          "<span class=\"cred-icon\"" + (c.open ? " style=\"background:" + c.rail + "\"" : "") + ">" + (c.open ? "−" : "+") + "</span>" +
        "</button>" + bodyHtml +
      "</div>";
    }).join("");

    els.rulesWrap.innerHTML =
      "<div class=\"eyebrow\">" + t.credEyebrow + "</div>" +
      "<h2 class=\"h2\">" + t.credTitleA + " <span style=\"color:var(--red)\">" + t.credTitleB + "</span></h2>" +
      "<div class=\"rules-head-row\"><p>" + t.credIntro + "</p>" +
        "<a href=\"" + LINKS.senateTr + "\" target=\"_blank\" rel=\"noopener\" class=\"btn-navy-pill\">📘 " + t.credDoc + " ↗</a></div>" +
      "<div class=\"cred-accordion\">" + accHtml + "</div>" +
      "<div class=\"cred-summary-grid\">" +
        "<div class=\"cred-summary-box navy\"><div class=\"head\"><span class=\"emoji\">📋</span><span class=\"title\">" + t.credWhenTitle + "</span></div><div class=\"body\">" + t.credWhenText + "</div></div>" +
        "<div class=\"cred-summary-box pink\"><div class=\"head\"><span class=\"emoji\">☀️</span><span class=\"title\">" + t.credIeTitle + "</span></div><div class=\"body\">" + t.credIeText + "</div></div>" +
      "</div>";
  }

  function renderDepartments(t, faculties){
    var chips1 = t.celtChips.map(function(c){ return "<span>" + c + "</span>"; }).join("");
    var chips2 = t.coordChips.map(function(c){ return "<span>" + c + "</span>"; }).join("");
    var facHtml = faculties.map(function(f, fi){
      var deptsHtml = f.departments.map(function(d){
        return "<div class=\"fac-dept-row\"><span class=\"dname\">" + d.name + "</span><span class=\"dcoord\">" + d.coordinator + "</span>" +
          "<span><a href=\"mailto:" + d.email + "\">" + d.email + "</a></span></div>";
      }).join("");
      return "<div class=\"fac-item" + (f.open ? " open" : "") + "\">" +
        "<button type=\"button\" class=\"fac-toggle\" data-action=\"fac:" + fi + "\">" +
          "<span class=\"left\"><span class=\"fac-dot\" style=\"background:" + f.dot + "\"></span><span class=\"fac-name\">" + f.name + "</span><span class=\"fac-count\">" + f.countLabel + "</span></span>" +
          "<span class=\"fac-icon\">" + (f.open ? "−" : "+") + "</span></button>" +
        "<div class=\"fac-body\"><div class=\"fac-depts\">" + deptsHtml + "</div></div>" +

        "<div class=\"contact-panel blue\"><div class=\"contact-head\"><span class=\"contact-icon\">🎓</span><span><span class=\"title\">" + t.coordCardTitle + "</span><span class=\"sub\">" + t.coordCardSub + "</span></span></div>" +

      "</div>" +
      "<div style=\"display:grid; gap:10px\">" + facHtml + "</div>";
  }

  function renderFaq(t, faqTabs, faqItems){

      return "<button type=\"button\" class=\"faq-tab" + (tb.active ? " active" : "") + "\" data-action=\"faqcat:" + gi + "\">" + tb.title + " <span class=\"pill\">" + tb.count + "</span></button>";

  }

  /* ============ EVENTS ============ */
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if (!el) return;
    e.preventDefault();
    var parts = el.getAttribute("data-action").split(":");
    var cmd = parts[0], arg = parts[1];
    if (cmd === "tab") { STATE.tab = arg; try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (err) { window.scrollTo(0, 0); } }
    else if (cmd === "lang") { STATE.lang = arg; }
    else if (cmd === "rail") { STATE.stepSel = parseInt(arg, 10); }
    else if (cmd === "checklist") { STATE.checklistOpen = !STATE.checklistOpen; }
    else if (cmd === "fac") { var fi = parseInt(arg, 10); STATE.openFac[fi] = !STATE.openFac[fi]; }
    else if (cmd === "cred") { var ci = parseInt(arg, 10); STATE.openCred = (STATE.openCred === ci) ? -1 : ci; }
    else if (cmd === "faqcat") { STATE.faqCat = parseInt(arg, 10); STATE.openFaq = -1; }
    else if (cmd === "faq") { var qi = parseInt(arg, 10); STATE.openFaq = (STATE.openFaq === qi) ? -1 : qi; }
    render();
  });

  render();
})();
